services:
  # FastAPI RAG backend (rag/ + api/)
  - type: web
    name: vcet-ai-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements-dev.txt"
    startCommand: "gunicorn api.main:app -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.9"
      - key: PORT
        value: "5000"
    healthCheckPath: /api/health
